<style>

.muted{color:var(--muted)} .small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.ring.gold .val{stroke:var(--gold)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;display:flex}

.sec b{font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.learning{background:var(--gold)} .dot.review{background:#6BA8C9} .dot.mastered{background:var(--good)}

.top{display:flex;align-items:center;gap:14px}
.top .bar{flex:1}

.fc .ans .cw{color:var(--accent)}
.fc .tag{position:absolute;top:16px;inset-inline:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.spk{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:inline-grid;place-items:center;flex:none}
.spk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.qbox .qm{font-size:calc(27px*var(--ws));font-weight:500;line-height:1.7}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.days .d i{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:var(--accent);min-height:4px}
.days .d i.z{background:var(--surface2)}
.days .d span{font-size:12.5px;color:var(--muted)} .days .d em{font-style:normal;font-size:13px;font-weight:700}

.miss .qw{font-family:var(--quran);font-size:24px;min-width:130px} .miss span{flex:1;color:var(--fg);font-size:15.5px}

</style>

/* ======================= الحالة والتخزين ======================= */
const KEY='kahf-vocab-v1';
const def=()=>({w:{},days:{},xp:0,perfect:0,best:{},set:{theme:'auto',size:1,goal:20,newPerDay:8,dir:'w2m',tts:true}});
let S=def();
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j.w==='object'){S={...def(),...j,set:{...def().set,...(j.set||{})}}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dayRec=()=>S.days[today()]||(S.days[today()]={r:0,c:0,n:0});
const wst=id=>S.w[id]||null;
const status=id=>{const w=wst(id);if(!w||!w.seen)return'new';return w.box>=4?'mastered':w.box===3?'review':'learning'};
const SN={new:'جديدة',learning:'قيد التعلّم',review:'قيد المراجعة',mastered:'متقنة'};
function record(id,ok){
  const w=S.w[id]||(S.w[id]={box:0,due:0,seen:0,ok:0,bad:0,fav:0});
  const D=dayRec();const t=Date.now();
  if(!w.seen)D.n++;
  w.seen++;D.r++;
  if(ok){w.ok++;D.c++;S.xp+=2;
    if(w.box===0)w.box=2;else if(w.due<=t)w.box=Math.min(5,w.box+1);else return save();
  }else{w.bad++;w.box=1}
  w.due=t+INTV[w.box];save();
}
const dueIds=()=>W.filter(w=>{const s=wst(w.id);return s&&s.seen&&s.due<=Date.now()}).map(w=>w.id);
const newIds=()=>W.filter(w=>{const s=wst(w.id);return !s||!s.seen}).map(w=>w.id);
const weakIds=()=>W.filter(w=>{const s=wst(w.id);return s&&s.bad>0&&s.box<=2}).map(w=>w.id);
const favIds=()=>W.filter(w=>{const s=wst(w.id);return s&&s.fav}).map(w=>w.id);
const masteredN=()=>W.filter(w=>status(w.id)==='mastered').length;
const seenN=()=>W.filter(w=>status(w.id)!=='new').length;
function streak(){let k=0;const d=new Date();if(!(S.days[key(d)]&&S.days[key(d)].r))d.setDate(d.getDate()-1);while(S.days[key(d)]&&S.days[key(d)].r){k++;d.setDate(d.getDate()-1)}return k}
const LV=['مبتدئ','متعلّم','دارس مجتهد','حافظ للمعاني','متقن','فارس الكهف'];
const level=()=>{const l=Math.floor(S.xp/120);return{n:l+1,title:LV[Math.min(l,LV.length-1)],into:S.xp%120}};
function scopeIds(sc){
  if(sc==='all')return W.map(w=>w.id);
  if(sc==='due')return dueIds();if(sc==='new')return newIds();if(sc==='weak')return weakIds();if(sc==='fav')return favIds();
  if(sc[0]==='s')return W.filter(w=>w.sec===+sc.slice(1)).map(w=>w.id);
  return[];
}
const scopeName=sc=>({all:'كل السورة',due:'المستحقة للمراجعة',new:'الجديدة',weak:'الصعبة',fav:'المفضلة'}[sc]||SECS[+sc.slice(1)][0]);
function say(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=.75;speechSynthesis.speak(u)}catch(e){}}
const canSay=()=>{try{return S.set.tts&&'speechSynthesis' in window}catch(e){return false}};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

  const r=document.documentElement;r.dir='rtl';r.lang='ar';

  r.style.setProperty('--ws',S.set.size);
}

function pickOthers(id,k,test){const out=[];for(const w of shuf(W)){if(w.id===id)continue;if(test(w)&&!out.find(o=>test(o)===test(w))){out.push(w);if(out.length>=k)break}}return out}

  if(kind==='tf'){const t=Math.random()<.5;const o=t?w:pickOthers(id,1,x=>x.mean!==w.mean?x.mean:null)[0];return{kind,id,q:`<div class="q">${w.word}</div><div class="qm" style="color:var(--accent)">${o.mean}</div>`,sub:'هل هذا المعنى صحيح؟',opts:['صحيح','خطأ'],ans:t?0:1,ot:''}}
  if(kind==='type')return{kind,id,q:`<div class="qm">${w.mean}</div>`,sub:'اكتب الكلمة (التشكيل اختياري)',typed:true};

function startQuiz(kind,sc,count){

function nextSpeed(){let id;do{id=session.pool[Math.floor(Math.random()*session.pool.length)]}while(id===session.last&&session.pool.length>1);session.last=id;session.q=mkQ(Math.random()<.5?'mc_w2m':'mc_m2w',id);}
function tick(){const s=session;if(!s||s.kind!=='speed'){return}const left=Math.max(0,Math.ceil((s.end-Date.now())/1000));const e=$('#tm');if(e)e.textContent=ar(left);if(left<=0){clearInterval(s.tm);finishSpeed()}}
function finishSpeed(){const s=session;if(S.best.speed==null||s.score>S.best.speed){S.best.speed=s.score;save();}finish({title:s.title,score:s.score,total:s.total,missed:[...s.missed],speed:true,again:()=>startQuiz('speed',s.sc)})}

function matchTap(side,id,el){
  const s=session;
  if(!s.sel||s.sel.side===side){s.sel=s.sel&&s.sel.side===side&&s.sel.id===id?null:{side,id};return render()}
  if(s.sel.id===id){
    s.done.add(id);record(id,!s.wrong.has(id));if(!s.wrong.has(id))s.ok++;s.sel=null;

  const t=Date.now();let ok=0,bad=0;Object.values(S.w).forEach(w=>{ok+=w.ok;bad+=w.bad});
  const acc=ok+bad?Math.round(ok/(ok+bad)*100):0;
  const cnt={new:0,learning:0,review:0,mastered:0};W.forEach(w=>cnt[status(w.id)]++);
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const r=(S.days[key(d)]||{r:0}).r;days.push({r,l:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.getDay()]})}
  const mx=Math.max(S.set.goal,...days.map(d=>d.r));
  const weak=Object.entries(S.w).filter(([id,w])=>w.bad>0).sort((a,b)=>b[1].bad-a[1].bad).slice(0,8);
  const L=level(),bd=badges();
  return`<div class="wrap"><h1>تقدّمي</h1>
  <div class="grid g4"><div class="card stat"><span class="muted small">الدقة</span><b>${ar(acc)}٪</b></div><div class="card stat"><span class="muted small">إجمالي المحاولات</span><b>${ar(ok+bad)}</b></div><div class="card stat"><span class="muted small">أيام متتالية</span><b>${ar(streak())}</b></div><div class="card stat"><span class="muted small">المستوى ${ar(L.n)}</span><b style="font-size:21px">${L.title}</b></div></div>
  <div class="card"><h3 style="margin-bottom:12px">حالة الكلمات</h3><div class="bar" style="height:16px"><i style="width:${cnt.mastered/N*100}%;background:var(--good)"></i><i class="r" style="width:${cnt.review/N*100}%"></i><i class="l" style="width:${cnt.learning/N*100}%"></i></div>
  <div class="row small" style="margin-top:12px;gap:20px">${[['mastered','متقنة'],['review','قيد المراجعة'],['learning','قيد التعلّم'],['new','جديدة']].map(([k,l])=>`<span class="row" style="gap:6px"><span class="dot ${k}"></span>${l} <b>${ar(cnt[k])}</b></span>`).join('')}</div></div>
  <div class="card"><h3>آخر ٧ أيام</h3><div class="days">${days.map(d=>`<div class="d"><em>${d.r?ar(d.r):''}</em><i class="${d.r?'':'z'}" style="height:${d.r/mx*100}%"></i><span>${d.l}</span></div>`).join('')}</div><div class="small muted" style="margin-top:6px">عدد الإجابات في اليوم · الهدف ${ar(S.set.goal)}</div></div>
  <div class="grid g2"><div class="card"><h3 style="margin-bottom:12px">أكثر الكلمات تعثّرًا</h3>${weak.length?weak.map(([id,w])=>`<div class="miss" style="margin-bottom:8px;background:var(--surface2)"><span class="qw">${W[id].word}</span><span>${W[id].mean}</span><b style="color:var(--bad)">${ar(w.bad)}×</b></div>`).join(''):'<div class="muted">لا أخطاء حتى الآن. ابدأ بجلسة وستظهر هنا.</div>'}</div>
  <div class="card"><h3 style="margin-bottom:12px">الأوسمة</h3><div class="grid" style="gap:10px">${bd.map(b=>`<div class="badge ${b[3]?'on':''}"><div class="bi">${b[0]}</div><div><b>${b[1]}</b><span>${b[2]}</span></div></div>`).join('')}</div></div></div></div>`;
}

/* ======================= الإعدادات ======================= */
function rSettings(){
  const st=S.set;const ch=(arr,cur,act,d)=>`<div class="chips">${arr.map(([v,l])=>`<button class="chip" aria-pressed="${String(cur)===String(v)}" data-a="${act}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return`<div class="wrap"><h1>الإعدادات</h1>
  <div class="card" style="display:flex;flex-direction:column;gap:20px">
   <div><div class="lbl">المظهر</div>${ch([['auto','تلقائي'],['light','فاتح'],['dark','داكن']],st.theme,'sset','theme')}</div>
   <div><div class="lbl">حجم خط الكلمات</div>${ch([[0.85,'صغير'],[1,'متوسط'],[1.2,'كبير'],[1.4,'كبير جدًا']],st.size,'ssize')}</div>
   <div><div class="lbl">هدف الإجابات اليومي</div>${ch([[10,'١٠'],[20,'٢٠'],[30,'٣٠'],[50,'٥٠']],st.goal,'sgoal')}</div>
   <div><div class="lbl">كلمات جديدة في اليوم</div>${ch([[5,'٥'],[8,'٨'],[12,'١٢'],[20,'٢٠']],st.newPerDay,'snew')}</div>
   <div><div class="lbl">النطق الصوتي (يعتمد على أصوات الجهاز العربية)</div>${ch([[1,'مفعّل'],[0,'متوقف']],st.tts?1:0,'stts')}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>نسخة احتياطية</h3><div class="muted small">يُحفظ تقدّمك في متصفح هذا الجهاز. انسخ النص أدناه واحتفظ به لنقل تقدّمك إلى جهاز آخر أو لاستعادته.</div>
   <textarea id="bk" class="inp" readonly rows="3">${JSON.stringify(S).replace(/</g,"\\u003c")}</textarea>
   <div class="row"><button class="btn pri" data-a="copybk">نسخ النسخة الاحتياطية</button></div>
   <div class="lbl" style="margin-top:8px">استعادة من نسخة</div><textarea id="rs" class="inp" rows="3" placeholder="الصق النسخة الاحتياطية هنا"></textarea>
   <div class="row"><button class="btn" data-a="restore">استعادة</button></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>إعادة الضبط</h3><div class="muted small">يمسح كل تقدّمك وإحصائياتك من هذا الجهاز.</div>
   <div class="row" id="rz"><button class="btn bad" data-a="resetAsk">مسح التقدّم</button></div></div>
  <div class="small muted" style="text-align:center">مفردات سورة الكهف مأخوذة من «السراج في بيان غريب القرآن» للدكتور محمد بن عبد العزيز الخضيري (كرسي القرآن الكريم وعلومه، جامعة الملك سعود).</div></div>`;
}

/* ======================= الأحداث ======================= */
const A={
 go:d=>go(d.v),
 today:()=>{const p=plan();const ids=[...p.due,...p.nw];startCards(ids,'جلسة اليوم')},
 quick:()=>startQuiz('mix',seenN()>=8?'all':'all',10),
 startScope:d=>{ls.scope=d.sc;if(!scopeIds(d.sc).length)return toast('لا توجد كلمات في هذا القسم');startCards(scopeIds(d.sc),scopeName(d.sc))},
 lsc:d=>{ls.scope=d.sc;render()},dir:d=>{S.set.dir=d.d;save();render()},
 startLs:()=>startCards(scopeIds(ls.scope),scopeName(ls.scope)),
 qsc:d=>{qs.scope=d.sc;render()},qcount:d=>{qs.count=+d.c;render()},
 startQuiz:d=>startQuiz(d.k,d.sc||qs.scope,qs.count),
 rev:()=>{if(session&&session.type==='cards'&&!session.rev){session.rev=true;render()}},
 grade:d=>grade(d.ok==='1'),
 end:()=>{endSession();view=view;render()},
 opt:d=>{const q=curQ();if(session.fb)return;answer(+d.i===q.ans,+d.i)},
 nextq:()=>nextQ(),
 tcheck:()=>{const q=curQ(),v=norm(($('#tin')||{}).value||'');if(!v)return toast('اكتب الكلمة أولًا');answer(v===norm(W[q.id].word),null)},
 tskip:()=>answer(false,null,true),
 mt:d=>matchTap(d.side,+d.id),
 again:()=>session&&session.r.again(),
 reviewMissed:()=>startCards(session.r.missed,'مراجعة الأخطاء'),
 say:(d,el)=>{say(W[+d.id].word)},
 fav:d=>{const w=S.w[d.id]||(S.w[d.id]={box:0,due:0,seen:0,ok:0,bad:0,fav:0});w.fav=w.fav?0:1;save();render()},
 favl:d=>{const w=S.w[d.id]||(S.w[d.id]={box:0,due:0,seen:0,ok:0,bad:0,fav:0});w.fav=w.fav?0:1;save();$('#wl').innerHTML=wordRows()},
 hide:()=>{wf.hide=!wf.hide;render()},
 peek:(d,el)=>el.classList.remove('hid'),
 sset:d=>{S.set.theme=d.v;save();applyPrefs();render()},
 ssize:d=>{S.set.size=+d.v;save();applyPrefs();render()},
 sgoal:d=>{S.set.goal=+d.v;save();render()},snew:d=>{S.set.newPerDay=+d.v;save();render()},
 stts:d=>{S.set.tts=d.v==='1';save();render()},
 copybk:()=>{const t=JSON.stringify(S);const ta=$('#bk');ta.value=t;ta.select();try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'),()=>toast('حدّد النص وانسخه يدويًا'))}catch(e){toast('حدّد النص وانسخه يدويًا')}},
 restore:()=>{try{const j=JSON.parse($('#rs').value);if(!j||typeof j.w!=='object')throw 0;S={...def(),...j,set:{...def().set,...(j.set||{})}};save();applyPrefs();toast('تمت الاستعادة');render()}catch(e){toast('النسخة غير صالحة')}},
 resetAsk:()=>{$('#rz').innerHTML='<span>هل أنت متأكد؟</span><button class="btn bad" data-a="resetDo">نعم، امسح</button><button class="btn" data-a="resetNo">إلغاء</button>'},
 resetNo:()=>render(),
 resetDo:()=>{S=def();save();applyPrefs();toast('تم مسح التقدّم');render()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(f)f(t.dataset,t)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='tin'){e.preventDefault();A.tcheck()}
  else if((e.key===' '||e.key==='Enter')&&e.target.classList&&e.target.classList.contains('fc')){e.preventDefault();A.rev()}
});
document.addEventListener('input',e=>{if(e.target.id==='wq'){wf.q=e.target.value;$('#wl').innerHTML=wordRows()}});
document.addEventListener('change',e=>{if(e.target.id==='wsec'){wf.sec=e.target.value;$('#wl').innerHTML=wordRows()}if(e.target.id==='wst'){wf.st=e.target.value;$('#wl').innerHTML=wordRows()}});
const h=(location.hash||'').slice(1);if(VIEWS.some(v=>v[0]===h))view=h;
window.addEventListener('hashchange',()=>{const x=location.hash.slice(1);if(VIEWS.some(v=>v[0]===x)&&x!==view){endSession(true);view=x;render()}});
applyPrefs();render();
</script>

</body></html>
